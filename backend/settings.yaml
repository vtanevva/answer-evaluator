# Answer Evaluator Backend Configuration

# Server Configuration
server:
  host: "0.0.0.0"
  port: 8000
  reload: false
  title: "Answer Evaluator"
  description: "Evaluate student answers using embeddings"

# CORS Configuration
cors:
  allowed_origins:
    - "http://localhost:3000"  # React dev server
    - "http://127.0.0.1:3000"
  allow_credentials: true
  allowed_methods: ["*"]
  allowed_headers: ["*"]

# OpenAI Configuration
openai:
  model_name: "text-embedding-ada-002"
  embedding_dimensions: 1536

# Unified Embeddings Configuration
# ============================================
# Easy model switching - just change these fields:
# ============================================
# Examples:
#
# OpenAI (remote API):
#   model: "text-embedding-ada-002"
#   type: "openai"
#   dimensions: 1536
#
# GTE-Multilingual (local):
#   model: "Alibaba-NLP/gte-multilingual-base"
#   type: "sentence-transformer"
#   dimensions: 768
#
# Any HuggingFace model (local):
#   model: "sentence-transformers/all-MiniLM-L6-v2"
#   type: "sentence-transformer"
#   dimensions: 384
# ============================================
embeddings:
  # Model identifier (API model name or HuggingFace model path)
  model: "Alibaba-NLP/gte-multilingual-base"
  
  # Model type: "openai" for API calls, "sentence-transformer" for local models
  type: "sentence-transformer"
  
  # Embedding dimensions (must match the model's output)
  dimensions: 768

# Pinecone Configuration
pinecone:
  # API key is loaded from PINECONE_API_KEY environment variable
  environment: "gcp-starter"
  index_name: "ae"
  dimension: 768  # Must match embeddings.dimensions above
  metric: "cosine"

# Evaluation Configuration
grading:
  
  grading_method: "hybrid"  # "hybrid", "nli", or "embedding"
  
  # NLI Model Configuration
  # ============================================
  nli_model_small: "cross-encoder/nli-deberta-v3-small"      # Primary (140MB, 50ms)
  nli_model_base: "cross-encoder/nli-deberta-v3-base"        # Escalation (430MB, 150ms)
  
  nli_entailment_threshold: 0.50            # Threshold for entailment
  nli_contradiction_threshold: 0.75         # Lowered for better detection
  
  # Performance optimizations
  nli_batch_size: 4                         # Process multiple sentences in batch
  nli_max_length: 256                       # Reduced from 512 for speed
  nli_use_fp16: true                        # Half precision for 2x speed (if GPU)
  
  # Uncertainty Logging (for active learning - no cost)
  log_uncertain_cases: true
  uncertainty_threshold: 0.7  # Log cases with uncertainty score > 0.7 for review
  
  # LLM Arbiter Configuration - GROQ LLAMA 70B
  # ============================================
  # Cost: ~$0.20 per 1000 answers (very affordable)
  # ============================================

  llm_arbiter_enabled: true
  llm_arbiter_provider: "groq"
  llm_arbiter_model: "llama-3.1-70b-versatile"  
  llm_arbiter_timeout: 5                      
  llm_arbiter_max_tokens: 150
  
  # LLM Smart Fallback - DISABLED FOR NOW
  # ============================================
  # Set to "fallback" and add GROQ_API_KEY to enable
  # ============================================
  llm_holistic_mode: "never"                    # "never", "always", or "fallback"
  llm_holistic_uncertainty_threshold: 0.20
  
  # Trigger conditions (ALL must be met OR any critical flag)
  llm_trigger_conditions:
    min_disagreement: 0.55                  # Cosine-NLI difference >55%
    min_uncertainty: 0.80                   # Combined uncertainty score
    enable_on_contradiction_conflict: true  # NLI says contradiction but cosine high

  
  # Fast Track thresholds
  fast_track_cosine_high: 0.92              # ≥92% similarity = instant pass
  fast_track_cosine_with_overlap: 0.88      # ≥88% cosine + ≥50% overlap = instant pass
  fast_track_overlap_threshold: 0.50
  
  # Standard Track thresholds  
  standard_track_min: 0.70                  # Minimum for NLI verification
  standard_track_max: 0.92                  # Maximum for standard track
  
  # Disagreement escalation thresholds
  agreement_threshold: 0.15                 # <15% difference = models agree
  moderate_disagreement: 0.45               # 15-45% = use NLI decision
  high_disagreement: 0.55                   # >55% = LLM arbiter
  
  # Performance optimization
  enable_parallel_processing: true          # Run cosine + NLI in parallel
  nli_timeout_ms: 200                       # Max time for NLI inference
  cache_nli_results: true                   # Cache NLI results for identical sentences
  
  # Embedding Configuration (only used if grading_method = "embedding")
  precompute_embeddings: true  # If true, compute fresh embeddings on startup; if false, load from cache
  embeddings_file_path: "embeddings_cache.json"  # File to save/load precomputed embeddings
  
  similarity_thresholds:
    high_similarity: 0.855  # Strict threshold for high confidence matches
    mid_similarity: 0.80   # Mid-range threshold
    llm_verification_threshold: 0.8  # LLM double-check threshold for borderline matches
    min_lexical_overlap: 0.4  # Require word overlap
  
  feedback_messages:
    perfect_score: "Correct! You covered all the key points."
    partial_score: "Partial - missing {missing_count} key point(s). Good start!"
    low_score: "Incorrect - try again. Review the material and provide a more complete answer."
    empty_answer: "Please try again. Even if you're unsure, try to explain what you think might be the answer."
    short_answer: "Your answer is too short. Please provide a more detailed explanation with at least a few words."
  
  answer_validation:
    min_answer_length: 10
    min_word_count: 2
    invalid_answers:
      - "i don't know"
      - "not sure"
      - "i forgot"
      - "i don't remember"
      - "i hate"
    violent_answers:
      - "kill"
      - "murder"
      - "beat"
      - "beat up"
      - "beat down"
      - "fuck"
      - "rape"
      - "shoot"
      - "stab"
      - "assault"
      - "shit"
    feedback_message: "{invalid_answer} is not a valid answer to the question. Try again."


# Questions Configuration
questions:
  default_file_path: "../data/questions/"
  fallback_questions:
    - question_id: 1
      question_text: "What is inflation?"
      key_points:
        - text: "General increase in prices"
          weight: 1
        - text: "Reduction of purchasing power"
          weight: 1
    - question_id: 2
      question_text: "Explain supply and demand"
      key_points:
        - text: "Relationship between price and quantity demanded"
          weight: 1
        - text: "As price increases, demand decreases"
          weight: 1
    - question_id: 3
      question_text: "What are three adaptations that help desert animals survive?"
      key_points:
        - text: "Store water in their bodies"
          weight: 1
        - text: "Active at night"
          weight: 1
        - text: "Light-colored skin"
          weight: 1

# Text Processing Configuration
text_processing:
  additional_stopwords: "vs versus per each e.g. i.e. etc"
  stemming_suffixes: ["ing", "ed", "es", "s"]
  min_token_length: 4

# AI Antonym Detection Configuration
antonym_detection:
  # Semantic distance threshold (lower = more similar, antonyms should be far apart)
  semantic_distance_threshold: 0.05
  
  # Context similarity threshold (high context similarity + low semantic similarity = antonym)
  context_similarity_threshold: 0.7
  
  # Confidence thresholds for different detection levels
  confidence_thresholds:
    high: 0.8
    medium: 0.6
    low: 0.4
  
  # Whether to use LLM validation for complex cases
  use_llm_validation: true
  
  # Threshold below which to use LLM validation
  llm_validation_threshold: 0.5
  
  # Method weights for combining results
  method_weights:
    semantic_distance: 0.3
    contextual_analysis: 0.2
    known_pattern: 0.5
    negation_pattern: 0.5
    llm_validation: 0.3
  
  # Penalty multiplier for detected antonyms in evaluation
  antonym_penalty_multiplier: 0.8  # Reduced from 0.2 (80% reduction → 20% reduction)
  
  # Minimum confidence required to apply antonym penalty
  min_confidence_for_penalty: "medium"
